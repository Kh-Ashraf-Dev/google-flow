app = 'awqaf-studio'
primary_region = 'fra'

[build]

[env]
  API_PORT = '8080'
  DATA_DIR = '/data'

# The database is Neon Postgres (DATABASE_URL secret). This volume holds generated media only,
# so it's still one machine until media moves to object storage.
[mounts]
  source = 'studio_data'
  destination = '/data'

[http_service]
  internal_port = 8080
  force_https = true
  # Videos finish in the background (1–2 min), so the machine must not stop mid-job.
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    path = '/healthz'
    interval = '30s'
    timeout = '5s'
    grace_period = '20s'

[[vm]]
  size = 'shared-cpu-1x'
  # ffmpeg joins scenes in memory.
  memory = '1gb'
